<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 설치 파일 아이콘: Boom 폭탄 + 오른쪽 아래 다운로드 배지 -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="28" y1="40" x2="220" y2="236">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#6d8cf7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- 배지 둘레만큼 폭탄 선을 비워서 배경이 무엇이든 배지가 또렷하게 -->
    <mask id="cut">
      <rect width="256" height="256" fill="#fff"/>
      <circle cx="194" cy="196" r="62" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#cut)">
    <g fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round" transform="translate(8 -2)">
      <g transform="rotate(36 114 150)">
        <path d="M92 68 V44 Q92 34 102 34 H126 Q136 34 136 44 V68" stroke-width="14"/>
        <path d="M114 34 C 114 16, 132 18, 128 2" stroke-width="12"/>
      </g>
      <circle cx="114" cy="150" r="86" stroke-width="20"/>
      <path d="M84 140 h 0" stroke-width="22"/>
      <path d="M144 140 h 0" stroke-width="22"/>
      <path d="M80 178 Q 114 208 148 178" stroke-width="12"/>
    </g>
  </g>
  <!-- download badge -->
  <circle cx="194" cy="196" r="50" fill="url(#g)"/>
  <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M194 168 V214"/>
    <path d="M174 196 L194 216 L214 196"/>
  </g>
</svg>
