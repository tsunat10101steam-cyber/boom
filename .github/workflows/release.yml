# v* 태그를 푸시하면 Boom.exe 를 빌드해서 GitHub 릴리스로 올린다.
# 앱의 업데이트 버튼이 이 릴리스(zip)를 받아 설치한다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 버전 기록 (태그 → version.py)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content version.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content version.py -Encoding utf8
          Get-Content version.py

      - name: 빌드
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --windowed --name Boom --icon app.ico --add-data "static;static" --add-data "app.ico;." app.py

      - name: 압축
        shell: pwsh
        run: Compress-Archive -Path dist/Boom -DestinationPath "Boom-${{ github.ref_name }}.zip"

      - name: 릴리스 노트 (CHANGELOG.md 의 해당 버전 항목)
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## ' + [regex]::Escape("${{ github.ref_name }}") + '\s*$(.*?)(?=^## |\z)'
          $m = [regex]::Match($text, $pattern)
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Boom ${{ github.ref_name }}" }
          Set-Content notes.md $notes -Encoding utf8

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "Boom-${{ github.ref_name }}.zip" --title "Boom ${{ github.ref_name }}" --notes-file notes.md
