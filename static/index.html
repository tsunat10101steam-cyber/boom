<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boom</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/topology.css">
<script src="/static/i18n.js"></script>
<meta name="theme-color" content="#0e0f1a">
<style>
  /* 테마: <html data-theme="A~F">. 설정(⚙)에서 바꾸고 localStorage 에 기억 */
  :root, [data-theme="F"] {
    color-scheme: dark;
    --bg: #0f1424; --panel: #161c30; --panel2: #1c2339; --line: #232b45; --line-hover: #36406a;
    --text: #e6e9f5; --mute: #7d86a6; --accent: #7aa2ff; --on-accent: #0f1424;
    --danger: #ff6b81; --ok: #34d399; --warn: #fbbf24; --row-hover: #1a2036; --log-bg: #0b0f1c;
  }
  [data-theme="A"] {
    color-scheme: light;
    --bg: #ffffff; --panel: #f6f6f7; --panel2: #ffffff; --line: #e6e6e8; --line-hover: #c9c9cf;
    --text: #18181b; --mute: #6b6b73; --accent: #7c5cf0; --on-accent: #ffffff;
    --danger: #dc2626; --ok: #16a34a; --warn: #b7791f; --row-hover: #f0f0f2; --log-bg: #fafafa;
  }
  [data-theme="B"] {
    color-scheme: light;
    --bg: #f4f1ea; --panel: #fffdf8; --panel2: #f8f4ec; --line: #e4ddcf; --line-hover: #cdc3b0;
    --text: #2a2620; --mute: #7d7568; --accent: #7c5cf0; --on-accent: #ffffff;
    --danger: #dc2626; --ok: #15803d; --warn: #b45309; --row-hover: #f6f1e6; --log-bg: #faf7f0;
  }
  [data-theme="C"] {
    color-scheme: light;
    --bg: #f3f1fb; --panel: #ffffff; --panel2: #f7f6fc; --line: #e3dff5; --line-hover: #c9c2ea;
    --text: #1e1b2e; --mute: #6f6990; --accent: #6d4ee8; --on-accent: #ffffff;
    --danger: #dc2626; --ok: #16a34a; --warn: #b7791f; --row-hover: #f4f2fc; --log-bg: #faf9fe;
  }
  [data-theme="D"] {
    color-scheme: dark;
    --bg: #18181a; --panel: #232326; --panel2: #2b2b2f; --line: #333338; --line-hover: #4a4a52;
    --text: #ececef; --mute: #8b8b93; --accent: #a594ff; --on-accent: #18181a;
    --danger: #ff6b6b; --ok: #4ade80; --warn: #f5b942; --row-hover: #29292d; --log-bg: #141416;
  }
  [data-theme="E"] {
    color-scheme: dark;
    --bg: #000000; --panel: #000000; --panel2: #0c0c0c; --line: #262626; --line-hover: #444444;
    --text: #f5f5f5; --mute: #7a7a7a; --accent: #ffffff; --on-accent: #000000;
    --danger: #ff5a5a; --ok: #4ade80; --warn: #f5b942; --row-hover: #0f0f0f; --log-bg: #050505;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
  .muted { color: var(--mute); }
  .err { color: var(--danger); }
  .hidden { display: none !important; }

  header { display: flex; align-items: center; gap: 10px; padding: 12px 22px; position: sticky; top: 0; z-index: 10;
           background: var(--bg); border-bottom: 1px solid var(--line); }
  header img { width: 30px; height: 30px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  header button, #ident { white-space: nowrap; }
  #ident { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--mute); font-size: 12.5px; }
  .pill { padding: 3px 10px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); color: var(--text); }

  button { font: inherit; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
           border-radius: 8px; padding: 6px 13px; cursor: pointer; transition: border-color .15s, opacity .15s; }
  button:hover:not(:disabled) { border-color: var(--line-hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  button.ghost { background: none; border-color: transparent; color: var(--mute); padding: 4px 8px; }
  button.ghost:hover { color: var(--text); }
  input[type=text], input[type=password], select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font: inherit; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }

  main { max-width: 1440px; margin: 0 auto; padding: 18px 22px 60px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; margin-bottom: 14px; }
  .w { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; position: relative; }
  .w h2 { font-size: 13px; color: var(--mute); margin: 0 0 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .w h2 .act { margin-left: auto; font-weight: 400; }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; }
  .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c12 { grid-column: span 12; }
  @media (max-width: 1100px) { .c3 { grid-column: span 6; } .c4, .c5, .c6, .c7 { grid-column: span 12; } }
  @media (max-width: 640px) { .c3 { grid-column: span 12; } main { padding: 12px; } header { padding: 10px 12px; } }

  /* cost */
  .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .cost-hero { display: flex; flex-direction: column; }
  #costBody { flex: 1; display: flex; flex-direction: column; }
  #costBody .spark { flex: 1; min-height: 70px; }
  .legend-cur { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--accent); vertical-align: -1px; }
  .big { font-size: 40px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .big small { font-size: 18px; color: var(--mute); font-weight: 500; }
  .kpis { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 10px 0 12px; font-size: 13px; }
  .kpis b { font-variant-numeric: tabular-nums; }
  .up { color: var(--danger); } .down { color: var(--ok); }
  .spark { width: 100%; height: 70px; display: block; }
  .spark rect { fill: var(--line); }
  .spark rect.cur { fill: var(--accent); }
  .spark rect:hover { opacity: .75; }
  .skeleton { color: var(--mute); padding: 18px 0; }

  .bars { display: grid; gap: 7px; }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13px; }
  .bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .val { font-variant-numeric: tabular-nums; color: var(--mute); }
  .bar .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 3px; background: var(--accent); }

  /* resource tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer;
          transition: border-color .12s; }
  .tile:hover { border-color: var(--line-hover); }
  .tile.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .tile.zero { opacity: .45; }
  .tile .t { color: var(--mute); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .tile .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .tile .s { font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .alerts { display: grid; gap: 8px; }
  .alert { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; background: var(--panel2);
           border: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .alert:hover { border-color: var(--line-hover); }
  .alert .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; flex: none; }
  .alert .ic.w { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .alert .ic.d { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .alert .ic.o { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .alert .go { margin-left: auto; color: var(--mute); font-size: 12px; white-space: nowrap; }

  /* resources */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .tablewrap { overflow: auto; max-height: 56vh; border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel2); color: var(--mute); font-weight: 600; z-index: 1; }
  td.detail { white-space: normal; color: var(--mute); min-width: 240px; }
  tr:hover td { background: var(--row-hover); }
  tr.prot td { opacity: .55; }
  tr.gone td { text-decoration: line-through; opacity: .45; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11.5px; background: var(--panel2); border: 1px solid var(--line); }
  .b-run { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .b-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .b-prot { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .actionbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding-top: 12px; }
  .opts { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .opts label { display: inline-flex; gap: 6px; align-items: center; }
  #log { background: var(--log-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; height: 220px;
         overflow: auto; white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12.5px; margin: 0; }

  details.scope summary { cursor: pointer; color: var(--mute); font-size: 13px; list-style: none; }
  details.scope summary::-webkit-details-marker { display: none; }
  details.scope[open] summary { margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--panel2);
          border: 1px solid var(--line); font-size: 12px; cursor: pointer; user-select: none; }
  .chip input { margin: 0; width: 13px; height: 13px; }
  .progress { height: 3px; background: transparent; overflow: hidden; position: fixed; top: 0; left: 0; right: 0; z-index: 20; }
  .progress div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .warnbox { color: var(--warn); font-size: 12px; margin-top: 8px; white-space: pre-wrap; max-height: 100px; overflow: auto; }

  /* connect */
  #connect { max-width: 520px; margin: 8vh auto 0; text-align: center; }
  #connect img { width: 110px; height: 110px; }
  #connect h2 { justify-content: center; }
  .tabs { display: flex; gap: 6px; justify-content: center; margin: 14px 0; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); }
  .form { display: grid; gap: 8px; text-align: left; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 22px; width: min(560px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0 0 10px; }
  dialog ul { margin: 8px 0 14px; padding-left: 18px; max-height: 200px; overflow: auto; }

  /* 버전 / 업데이트 */
  footer.ver { text-align: center; color: var(--mute); font-size: 12px; padding: 10px 0 0; }
  footer.ver a { color: var(--mute); }
  .upd-notes { max-height: 50vh; overflow: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
               padding: 10px 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .upd-notes:empty { display: none; }

  /* settings */
  .langs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .langs button.on { border-color: var(--accent); color: var(--accent); }
  .themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 6px 0 4px; }
  .theme { padding: 0; border-radius: 10px; overflow: hidden; text-align: left; background: var(--panel2); }
  .theme.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .theme .pv { height: 64px; padding: 8px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 5px; }
  .theme .pv span { border-radius: 5px; border: 1px solid; position: relative; }
  .theme .pv span i { position: absolute; left: 6px; right: 40%; bottom: 7px; height: 5px; border-radius: 3px; }
  .theme .nm { padding: 7px 10px; font-size: 12.5px; display: flex; justify-content: space-between; border-top: 1px solid var(--line); }
  @media (max-width: 560px) { .themes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* 시작 로딩창: 연결하고 첫 스캔이 끝날 때까지. 배경은 연보라·연노랑·연분홍·연하늘 중 하나 (테마와 무관) */
  #boot { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; color: #2b2640;
          background: radial-gradient(circle at 50% 38%, #fff 0%, var(--boot-bg) 62%); transition: opacity .45s; }
  #boot.out { opacity: 0; pointer-events: none; }
  .boot-card { width: min(460px, 88vw); text-align: center; }
  .boot-anim { position: relative; width: 150px; height: 150px; margin: 0 auto 18px; }
  .boot-anim img { position: absolute; left: 39px; top: 39px; width: 72px; height: 72px; animation: bootBob 2.4s ease-in-out infinite; }
  .boot-ring { position: absolute; inset: 30px; border-radius: 50%; border: 2px solid var(--boot-deep); opacity: 0;
               animation: bootRing 2.4s ease-out infinite; }
  .boot-ring.r2 { animation-delay: 1.2s; }
  .boot-orbit { position: absolute; inset: 0; animation: bootSpin 2.8s linear infinite; }
  .boot-orbit i { position: absolute; left: 50%; top: 4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
                  background: var(--boot-deep); transform-origin: 6px 71px; }
  .boot-orbit i:nth-child(2) { transform: rotate(120deg); opacity: .65; width: 9px; height: 9px; margin-left: -4.5px; transform-origin: 4.5px 71px; }
  .boot-orbit i:nth-child(3) { transform: rotate(240deg); opacity: .35; width: 7px; height: 7px; margin-left: -3.5px; transform-origin: 3.5px 71px; }
  @keyframes bootBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes bootRing { 0% { transform: scale(.7); opacity: .55; } 100% { transform: scale(1.45); opacity: 0; } }
  @keyframes bootSpin { to { transform: rotate(360deg); } }
  .boot-title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .boot-status { margin-top: 4px; font-size: 14px; color: #5d5677; min-height: 20px; }
  .boot-bar { position: relative; height: 6px; margin: 14px auto 0; width: 220px; border-radius: 3px; overflow: hidden;
              background: color-mix(in srgb, var(--boot-deep) 18%, transparent); }
  .boot-bar div { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--boot-deep); transition: width .3s; }
  .boot-bar.ind div { width: 34%; animation: bootSlide 1.3s ease-in-out infinite; }
  @keyframes bootSlide { 0% { left: -34%; } 100% { left: 100%; } }
  .boot-tip { margin-top: 30px; padding: 14px 18px; border-radius: 14px; background: rgba(255,255,255,.62); font-size: 13.5px;
              line-height: 1.55; min-height: 74px; box-shadow: 0 6px 22px color-mix(in srgb, var(--boot-deep) 14%, transparent); }
  .boot-tip-h { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; color: var(--boot-deep); margin-bottom: 4px; }
  #bootTip { display: block; transition: opacity .35s; word-break: keep-all; text-wrap: pretty; }
  #bootTip.fade { opacity: 0; }
</style>
<script>
  // 첫 렌더 전에 테마 적용 (깜빡임 방지)
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<div id="boot" aria-live="polite">
  <div class="boot-card">
    <div class="boot-anim"><span class="boot-ring"></span><span class="boot-ring r2"></span>
      <div class="boot-orbit"><i></i><i></i><i></i></div><img src="/static/icon.svg" alt=""></div>
    <div class="boot-title">Boom</div>
    <div class="boot-status" id="bootStatus"></div>
    <div class="boot-bar ind" id="bootBar"><div></div></div>
    <div class="boot-tip"><span class="boot-tip-h" data-i18n="boot_tip"></span><span id="bootTip"></span></div>
  </div>
</div>
<div class="progress hidden" id="prog"><div></div></div>
<header>
  <img src="/static/icon.svg" alt="">
  <h1>Boom</h1>
  <div id="ident"></div>
  <button class="primary hidden" id="btnUpdate" data-i18n-title="update_tip"></button>
  <button class="ghost" id="btnSettings" data-i18n-title="settings" aria-label="Settings" style="font-size:16px">⚙</button>
</header>

<main>
  <!-- 연결 -->
  <section id="connect" class="w hidden">
    <img src="/static/icon.svg" alt="">
    <h2 data-i18n="connect_title"></h2>
    <div class="tabs">
      <button data-tab="profile" class="on" data-i18n="tab_profile"></button>
      <button data-tab="keys" data-i18n="tab_keys"></button>
    </div>
    <div id="tab-profile" class="form">
      <select id="profile"><option value="" data-i18n="profile_default"></option></select>
      <button class="primary" id="btnConnect1" data-i18n="connect"></button>
    </div>
    <div id="tab-keys" class="form hidden">
      <input type="text" id="ak" placeholder="Access Key ID" autocomplete="off">
      <input type="password" id="sk" placeholder="Secret Access Key" autocomplete="off">
      <input type="password" id="st" data-i18n-ph="session_token" autocomplete="off">
      <label id="rememberRow" style="display:flex;gap:6px;align-items:center;font-size:13px">
        <input type="checkbox" id="remember" checked> <span data-i18n="remember"></span> <span class="muted" style="font-size:12px" data-i18n="remember_note"></span></label>
      <button class="primary" id="btnConnect2" data-i18n="connect"></button>
    </div>
    <p id="connectMsg" class="muted" style="font-size:12.5px" data-i18n="keys_local"></p>
  </section>

  <!-- 대시보드 -->
  <section id="dash" class="hidden">
    <div class="grid">
      <div class="w c7 cost-hero">
        <h2><span data-i18n="cost_mtd"></span>
          <span class="act"><span id="costAsOf" class="muted" style="font-size:11.5px"></span>
          <button class="ghost" id="btnCost" data-i18n-title="cost_tip">↻</button></span></h2>
        <div id="costBody"><div class="skeleton" data-i18n="cost_loading"></div></div>
      </div>
      <div class="w c5">
        <h2 data-i18n="cost_by_service"></h2>
        <div id="svcBody" class="bars"><div class="skeleton">—</div></div>
      </div>
    </div>

    <div class="grid">
      <div class="w c7">
        <h2><span data-i18n="running_res"></span> <span id="scanInfo" class="act muted" style="font-size:11.5px"></span></h2>
        <div class="tiles" id="tiles"></div>
      </div>
      <div class="c5 stack">
        <div class="w">
          <h2 data-i18n="attention"></h2>
          <div class="alerts" id="alerts"><div class="skeleton" data-i18n="scanning"></div></div>
        </div>
        <div class="w" style="flex:1">
          <h2 data-i18n="by_region"></h2>
          <div class="bars" id="regionBars"><div class="skeleton">—</div></div>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="w c12" id="resCard">
        <h2><span data-i18n="res_mgmt"></span> <span class="act"><button class="ghost" id="btnScan" data-i18n="rescan"></button></span></h2>
        <details class="scope">
          <summary><span data-i18n="scope"></span> <span id="scopeInfo"></span></summary>
          <div style="margin-bottom:6px" class="muted"><span data-i18n="region"></span> <button class="ghost" id="rAll" data-i18n="all"></button><button class="ghost" id="rNone" data-i18n="none"></button></div>
          <div class="chips" id="regions"></div>
          <div style="margin:10px 0 6px" class="muted" data-i18n="res_types"></div>
          <div class="chips" id="types"></div>
          <div class="warnbox hidden" id="warns"></div>
        </details>
        <div class="toolbar" style="margin-top:10px">
          <input type="text" id="filter" data-i18n-ph="filter_ph" style="flex:1; min-width:180px">

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let identity = null, allTypes = [], items = [], selected = new Set(), typeFilter = null, keyFilter = null,
    results = {}, gone = new Set(), currency = "USD", creators = {};

const TYPE_COLORS = { "EC2": "#f59e0b", "ELB": "#a78bfa", "VPC Endpoint": "#22d3ee", "NAT Gateway": "#f43f5e",
  "Elastic IP": "#fb923c", "EBS Volume": "#34d399", "RDS": "#60a5fa", "RDS Cluster": "#818cf8", "S3": "#4ade80" };

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(errText(j) || r.statusText); e.data = j; throw e; }
  return j;
}
// 독일어·프랑스어·스페인어는 1,61 $ 처럼 쉼표 소수점, 나머지는 $1.61
const numLocale = () => (["de", "fr", "es"].includes(LANG) ? LANG : "en-US");
// 한국어일 때는 달러 요금을 그날 환율로 원화 환산 (설정에서 끌 수 있음)
let fxRate = null;  // { rate: 1달러당 원, date, source }
const krwOn = () => LANG === "ko" && store.get("fxKrw") !== "off" && !!fxRate?.rate && currency === "USD";
const toShown = (v) => (krwOn() ? (v ?? 0) * fxRate.rate : (v ?? 0));
const moneyFmt = (digits = 2) => krwOn()
  ? new Intl.NumberFormat("ko-KR", { style: "currency", currency: "KRW", minimumFractionDigits: 0, maximumFractionDigits: 0 })
  : new Intl.NumberFormat(numLocale(), { style: "currency", currency, minimumFractionDigits: digits, maximumFractionDigits: digits });
const money = (v, digits = 2) => moneyFmt(digits).format(toShown(v));
const usd = (v) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(v ?? 0);
async function loadFx() {
  if (LANG !== "ko" || store.get("fxKrw") === "off") return;
  try { const r = await api("/api/fx?to=KRW"); fxRate = r.error ? null : r; } catch { fxRate = null; }
  if (lastCost) renderCosts(lastCost);
}
// 큰 금액 표시: 소수점 아래만 작게
const moneyBig = (v) => moneyFmt().formatToParts(toShown(v)).map(p =>
  p.type === "decimal" || p.type === "fraction" ? `<small>${esc(p.value)}</small>` : esc(p.value)).join("");
// t() 결과에 HTML 조각을 끼워 넣을 때 (문장은 이스케이프, 조각은 그대로)
const tHtml = (key, html) => esc(t(key, Object.fromEntries(Object.keys(html).map(k => [k, `\u0000${k}\u0000`]))))
  .replace(/\u0000(\w+)\u0000/g, (_, k) => html[k]);

// ---- 시작 로딩창: 앱이 켜져서 AWS 에 연결하고 첫 스캔이 끝날 때까지. 팁(AWS 팁 + 숨은 기능 힌트)을 돌려 보여준다
const Boot = (() => {
  const COLORS = [["#ece4ff", "#7c5cf0"], ["#fff4c2", "#c78f00"], ["#ffe1ee", "#e0528a"], ["#dcefff", "#3a8ee6"]];  // 연보라·연노랑·연분홍·연하늘
  const TIPS = ["tip_1", "tip_2", "tip_3", "tip_4", "tip_5", "tip_6", "tip_7", "tip_8", "tip_9", "tip_secret"];
  const el = $("#boot");
  let on = true, phase = "connect", prog = null, tips = [], ti = 0, timer = null, shownAt = performance.now();
  function paint() {
    const [bg, deep] = COLORS[Math.floor(Math.random() * COLORS.length)];
    el.style.setProperty("--boot-bg", bg); el.style.setProperty("--boot-deep", deep);
    tips = [...TIPS].sort(() => Math.random() - 0.5); ti = 0;
  }
  function status() {
    $("#bootStatus").textContent = phase === "scan"
      ? (prog?.total ? t("boot_scanning_n", prog) : t("boot_scanning")) : t("boot_connecting");
    $("#bootBar").classList.toggle("ind", !prog?.total);
    $("#bootBar div").style.width = prog?.total ? `${Math.max(4, 100 * prog.done / prog.total)}%` : "";
    $("#bootTip").textContent = t(tips[ti]);
  }
  function nextTip() {
    $("#bootTip").classList.add("fade");
    setTimeout(() => { ti = (ti + 1) % tips.length; $("#bootTip").textContent = t(tips[ti]); $("#bootTip").classList.remove("fade"); }, 350);
  }
  function show() {
    if (!on) { on = true; paint(); shownAt = performance.now(); el.classList.remove("hidden", "out"); }
    phase = "connect"; prog = null; status();
    clearInterval(timer); timer = setInterval(nextTip, 4500);
  }
  function done() {
    if (!on) return;
    on = false; clearInterval(timer);
    setTimeout(() => { el.classList.add("out"); setTimeout(() => { if (!on) el.classList.add("hidden"); }, 450); },
      Math.max(0, 1200 - (performance.now() - shownAt)));  // 너무 빨리 끝나도 깜빡이지 않게 잠깐은 보여 준다
  }
  paint(); show();
  return { show, done, phase(p) { if (on) { phase = p; prog = null; status(); } },
    progress(done, total) { if (on) { prog = { done, total }; status(); } }, relang() { if (on) status(); }, get on() { return on; } };
})();

// ---- 단축키: Ctrl+Shift+T 토폴로지(숨은 기능 — 시작 로딩창 팁 하나 말고는 안내하지 않는다), Ctrl+Shift+Y 나가기.
// 토폴로지 안에서: Ctrl+Alt+X 편집기 · Alt+X 편집기 끄기 · Alt+S 배치 저장 · Ctrl+Alt+I 요소 추가 바 · Ctrl+Alt+R 삭제 모드
// · Alt+Y 삭제 확정 · Alt+Esc 어느 모드에서든 곧바로 일반 토폴로지 화면으로.
// 그 밖의 브라우저 단축키(새로고침, 뒤로, 확대 등)는 막는다. e.key 는 한글 입력 상태면 'ㅅ' 처럼 바뀌므로 물리 키(e.code)로 판단한다.
const EDIT_CODES = new Set(["KeyA", "KeyC", "KeyV", "KeyX", "KeyZ", "KeyY"]);
addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && !e.altKey && e.code === "KeyT") { e.preventDefault(); Topology.enter(); return; }
  if (e.ctrlKey && e.shiftKey && !e.altKey && e.code === "KeyY") { e.preventDefault(); Topology.exit(); return; }
  if (Topology.on && e.altKey && !e.shiftKey && !e.metaKey && ["KeyX", "KeyS", "KeyI", "KeyR", "KeyY", "Escape"].includes(e.code)) {
    e.preventDefault(); Topology.key(e); return; }
  const field = e.target.closest?.("input, textarea, select");
  if (/^F\d+$/.test(e.key)) { e.preventDefault(); return; }
  if (e.ctrlKey || e.altKey || e.metaKey) {
    if (field && e.ctrlKey && !e.shiftKey && !e.altKey && EDIT_CODES.has(e.code)) return;  // 입력칸 복사/붙여넣기 등은 허용
    e.preventDefault();
    return;
  }
  // 토폴로지에선 입력칸(만들기 폼) 타이핑만 그대로 두고, 나머지 키는 토폴로지 조작으로
  if (Topology.on && (!field || e.key === "Escape")) { e.preventDefault(); Topology.key(e); }
}, true);
addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });  // Ctrl+휠 화면 확대 막기

// ---- 버전 표시 / 업데이트 (GitHub 릴리스)
let update = null;
api("/api/version").then(v => {
  $("#ver").innerHTML = `Boom v${esc(v.version)} · <a href="${esc(v.repo)}" target="_blank" rel="noopener">GitHub</a>`;
}).catch(() => {});
async function checkUpdate(force) {
  try { update = await api("/api/update" + (force ? "?force=1" : "")); } catch { return; }
  const b = $("#btnUpdate");
  b.classList.toggle("hidden", !update.available);
  if (update.available) b.textContent = t("update_v", { v: update.latest });
}
// 업데이트 자동 확인 (설정에서 끌 수 있음 — 끄면 GitHub 에 접속하지 않는다)
const autoUpdateOn = () => store.get("autoUpdate") !== "off";
$("#autoUpdate").checked = autoUpdateOn();
$("#autoUpdate").onchange = (e) => {
  store.set("autoUpdate", e.target.checked ? "on" : "off");
  if (e.target.checked) checkUpdate(true); else { update = null; $("#btnUpdate").classList.add("hidden"); }
};
// 켤 때, 그 뒤로는 1시간마다, 그리고 창으로 돌아올 때(마지막 확인 후 10분 넘었으면) 확인한다.
// 앱을 켜 둔 채로 새 버전이 나와도 버튼이 늦지 않게 뜨도록.
let updCheckedAt = 0;
const autoCheck = (minGap) => {
  if (!autoUpdateOn() || Date.now() - updCheckedAt < minGap) return;
  updCheckedAt = Date.now();
  checkUpdate();
};
autoCheck(0);
setInterval(() => autoCheck(0), 3600 * 1000);
addEventListener("focus", () => autoCheck(10 * 60 * 1000));
$("#btnUpdate").onclick = () => {
  if (!update?.available) return;
  $("#updTitle").textContent = t("new_ver", { v: update.latest });
  $("#updSub").textContent = t("current_ver", { v: update.current }) +
    (update.published ? ` · ${t("released", { d: new Date(update.published).toLocaleDateString(LANG) })}` : "");
  $("#updNotes").textContent = (update.notes || "").replace(/\r/g, "").trim();
  $("#updErr").textContent = ""; $("#updGo").disabled = false; $("#updGo").textContent = t("update_now");
  $("#updDlg").showModal();
};
$("#updLater").onclick = () => $("#updDlg").close();
$("#updGo").onclick = async () => {
  $("#updGo").disabled = true; $("#updGo").textContent = t("downloading"); $("#updErr").textContent = "";
  try {
    // 대시보드 창은 바로 닫히고, 초록 진행 막대 창이 내려받기·설치 후 Boom 을 다시 연다
    await api("/api/update", { labels: { title: t("upd_title"), downloading: t("upd_downloading", { v: update.latest }),
      installing: t("installing"), failed: t("upd_failed"), close: t("close") } });
    window.close();
  } catch (e) {
    $("#updErr").textContent = e.message;
    $("#updGo").disabled = false; $("#updGo").textContent = t("update_now");
  }
};

// ---- 테마 (설정)
const THEMES = [  // 이름은 i18n.js 의 th.A ~ th.F
  { id: "A", bg: "#ffffff", panel: "#f6f6f7", line: "#e6e6e8", accent: "#7c5cf0" },
  { id: "B", bg: "#f4f1ea", panel: "#fffdf8", line: "#e4ddcf", accent: "#7c5cf0" },
  { id: "C", bg: "#f3f1fb", panel: "#ffffff", line: "#e3dff5", accent: "#6d4ee8" },
  { id: "D", bg: "#18181a", panel: "#232326", line: "#333338", accent: "#a594ff" },
  { id: "E", bg: "#000000", panel: "#000000", line: "#262626", accent: "#ffffff" },
  { id: "F", bg: "#0f1424", panel: "#161c30", line: "#232b45", accent: "#7aa2ff" },
];
function applyTheme(id) {
  document.documentElement.dataset.theme = id;
  const t = THEMES.find(x => x.id === id) || THEMES[5];
  document.querySelector('meta[name="theme-color"]').content = t.bg;
  document.querySelectorAll(".theme").forEach(b => b.classList.toggle("on", b.dataset.id === t.id));
}
$("#themes").innerHTML = THEMES.map(th => `
  <button class="theme" data-id="${th.id}">
    <div class="pv" style="background:${th.bg}">
      <span style="background:${th.panel};border-color:${th.line}"><i style="background:${th.accent}"></i></span>
      <span style="background:${th.panel};border-color:${th.line}"></span>
    </div>
    <div class="nm"><span data-i18n="th.${th.id}"></span><span class="muted">${th.id}</span></div>
  </button>`).join("");
document.querySelectorAll(".theme").forEach(b => b.onclick = () => { applyTheme(b.dataset.id); store.set("theme", b.dataset.id); });
applyTheme(store.get("theme") || "F");

// ---- 언어 (설정). 바꾸면 화면 문구 전체를 다시 그린다
$("#langs").innerHTML = LANGS.map(([code, name]) => `<button data-lang="${code}">${esc(name)}</button>`).join("");
document.querySelectorAll("#langs button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
function setLang(code) {
  LANG = code; store.set("lang", code);
  applyStaticText();
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
  $("#fxRow").classList.toggle("hidden", LANG !== "ko");
  if (LANG === "ko" && !fxRate) loadFx();
  if (lastCost) renderCosts(lastCost);
  if (identity) { saveScope(); renderScanInfo(); render(); }
  if (update) checkUpdate();
  Boot.relang();
  window.Topology?.relang();
}
applyStaticText();
document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
$("#fxRow").classList.toggle("hidden", LANG !== "ko");
$("#fxKrw").checked = store.get("fxKrw") !== "off";
$("#fxKrw").onchange = (e) => {
  store.set("fxKrw", e.target.checked ? "on" : "off");
  if (e.target.checked && !fxRate) loadFx(); else if (lastCost) renderCosts(lastCost);
};
loadFx();
$("#btnSettings").onclick = () => $("#settings").showModal();
$("#settingsClose").onclick = () => $("#settings").close();

// ---- 앱 창 수명: 창이 닫히면 서버도 종료
const beat = () => fetch("/api/heartbeat", { method: "POST" }).catch(() => {});
beat(); setInterval(beat, 10000);
addEventListener("pagehide", () => navigator.sendBeacon("/api/bye"));

// ---- 연결
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("#tab-profile").classList.toggle("hidden", b.dataset.tab !== "profile");
  $("#tab-keys").classList.toggle("hidden", b.dataset.tab !== "keys");
});

async function connect(body, silent) {
  $("#connectMsg").className = "muted"; $("#connectMsg").textContent = t("connecting");
  Boot.show();
  try {
    const j = await api("/api/connect", body);
    Boot.phase("scan");
    identity = j.identity; allTypes = j.types;
    if (body.profile !== undefined) store.set("profile", body.profile);
    else store.set("profile", "");  // 키로 연결함 → '연결 해제' 상태 표시 해제
    $("#sk").value = ""; $("#st").value = "";
    $("#ident").innerHTML = `<span class="pill mono">${esc(identity.account)}</span>
      <span class="mono" title="${esc(identity.arn)}">${esc(identity.arn.split(":").pop())}</span>
      <button class="ghost" id="btnDisconnect" data-i18n="disconnect">${esc(t("disconnect"))}</button>`;
    $("#btnDisconnect").onclick = async () => {
      if (!confirm(t("disconnect_confirm"))) return;
      await api("/api/disconnect", {}); store.set("profile", "__none__"); location.reload(); };
    $("#connect").classList.add("hidden"); $("#dash").classList.remove("hidden");
    const savedRegions = JSON.parse(store.get("regions") || "null");
    $("#regions").innerHTML = j.regions.map(r =>
      `<label class="chip"><input type="checkbox" value="${esc(r)}" ${!savedRegions || savedRegions.includes(r) ? "checked" : ""}>${esc(r)}</label>`).join("");
    $("#types").innerHTML = j.types.map(t =>
      `<label class="chip"><input type="checkbox" value="${esc(t)}" checked>${esc(t)}</label>`).join("");
    document.querySelectorAll("#regions input").forEach(i => i.onchange = saveScope);
    saveScope();
    loadCosts(false); scan();
  } catch (e) {
    Boot.done();
    $("#connect").classList.remove("hidden");
    $("#connectMsg").className = silent ? "muted" : "err";
    $("#connectMsg").textContent = silent ? t("pick_creds") : e.message;
  }
}
$("#btnConnect1").onclick = () => connect({ profile: $("#profile").value });
$("#btnConnect2").onclick = () => connect({ access_key: $("#ak").value, secret_key: $("#sk").value,
  session_token: $("#st").value, remember: $("#remember").checked });

(async function boot() {
  const j = await api("/api/profiles").catch(() => ({ profiles: [] }));
  j.profiles.filter(p => p !== "default").forEach(p => $("#profile").insertAdjacentHTML("beforeend", `<option>${esc(p)}</option>`));
  if (!j.can_remember) { $("#remember").checked = false; $("#rememberRow").classList.add("hidden"); }
  if (j.saved_keys) return connect({ use_saved: true });  // 기억해 둔 액세스 키로 바로 연결 (실패하면 이유 표시)
  const saved = store.get("profile");
  if (saved === "__none__") { Boot.done(); $("#connect").classList.remove("hidden"); return; }
  if (saved) $("#profile").value = saved;
  connect({ profile: saved || "" }, true);  // 실행하자마자 바로 대시보드
})();

// ---- 비용
async function loadCosts(refresh) {
  $("#btnCost").disabled = true;
  try {
    const c = await api("/api/costs" + (refresh ? "?refresh=1" : ""));
    currency = c.currency || "USD";
    renderCosts(c);
  } catch (e) {
    lastCost = null;
    $("#costBody").innerHTML = `<div class="skeleton">${esc(t("cost_failed"))}<br><span class="err" style="font-size:12.5px">${esc(e.message)}</span>
      <div style="font-size:12px;margin-top:6px">${tHtml("cost_perm", { perms: '<span class="mono">ce:GetCostAndUsage</span>, <span class="mono">ce:GetCostForecast</span>' })}</div></div>`;
    $("#svcBody").innerHTML = `<div class="skeleton">—</div>`;
  }
  $("#btnCost").disabled = false;
}
$("#btnCost").onclick = () => loadCosts(true);

let lastCost = null;
function renderCosts(c) {
  lastCost = c;
  $("#costAsOf").textContent = t("as_of", { t: c.as_of });
  const diff = c.prev_month_same_period > 0 ? (c.mtd / c.prev_month_same_period - 1) * 100 : null;
  const monthStart = c.month_start || new Date().toISOString().slice(0, 8) + "01";
  const max = Math.max(...c.daily.map(d => d.amount), 0.01);
  const n = c.daily.length, bw = 300 / Math.max(n, 1);
  const bars = c.daily.map((d, i) => {
    const h = Math.max(1.5, (d.amount / max) * 56);
    const cur = d.date >= monthStart && d.amount > 0;  // 비용 없는 날은 회색 바닥선만
    return `<rect class="${cur ? "cur" : ""}" x="${(i * bw + bw * .15).toFixed(2)}" y="${(60 - h).toFixed(2)}" width="${(bw * .7).toFixed(2)}" height="${h.toFixed(2)}" rx="1.5"><title>${d.date}  ${money(d.amount)}</title></rect>`;
  }).join("");
  $("#costBody").innerHTML = `
    <div class="big" title="${krwOn() ? esc(usd(c.mtd)) : ""}">${moneyBig(c.mtd)}</div>
    <div class="kpis">
      <span class="muted">${esc(t("forecast"))} <b style="color:var(--text)">${c.forecast != null ? money(c.forecast) : "—"}</b></span>
      <span class="muted">${esc(t("vs_last"))} ${diff == null ? "<b>—</b>" : `<b class="${diff > 0 ? "up" : "down"}">${diff > 0 ? "▲" : "▼"} ${Math.abs(diff).toFixed(1)}%</b>`}</span>
      <span class="muted">${esc(t("last_total"))} <b style="color:var(--text)">${money(c.prev_month_total)}</b></span>
    </div>
    <svg class="spark" viewBox="0 0 300 60" preserveAspectRatio="none">${bars}</svg>
    <div class="muted" style="font-size:11.5px;display:flex;justify-content:space-between"><span>${esc(t("daily30"))}</span><span><span class="legend-cur"></span> ${esc(t("this_month"))}</span></div>
    ${krwOn() ? `<div class="muted" style="font-size:11.5px;margin-top:4px">${esc(t("fx_note", { rate: fxRate.rate.toLocaleString("ko-KR", { maximumFractionDigits: 2 }), date: fxRate.date, source: fxRate.source }))}</div>` : ""}`;
  const svc = c.services.slice(0, 7), smax = Math.max(...svc.map(s => s.amount), 0.01);
  const rest = c.services.slice(7).reduce((a, s) => a + s.amount, 0);
  $("#svcBody").innerHTML = svc.length ? svc.map(s => `
    <div class="bar"><span class="lbl" title="${esc(s.name)}">${esc(s.name.replace(/^(Amazon|AWS) /, ""))}</span><span class="val">${money(s.amount)}</span>
      <div class="track"><div class="fill" style="width:${Math.max(1, s.amount / smax * 100)}%"></div></div></div>`).join("")
    + (rest > 0.005 ? `<div class="muted" style="font-size:12px">${esc(t("others", { n: c.services.length - 7, amt: money(rest) }))}</div>` : "")
    : `<div class="skeleton">${esc(t("no_cost"))}</div>`;
}

// ---- 스캔
const checked = (sel) => [...document.querySelectorAll(sel + " input:checked")].map(i => i.value);
function saveScope() {
  const r = checked("#regions"); store.set("regions", JSON.stringify(r));
  $("#scopeInfo").textContent = t("scope_n", { n: r.length });
}
$("#rAll").onclick = () => { document.querySelectorAll("#regions input").forEach(i => i.checked = true); saveScope(); };
$("#rNone").onclick = () => { document.querySelectorAll("#regions input").forEach(i => i.checked = false); saveScope(); };
$("#btnScan").onclick = () => scan();

async function scan() {
  const regions = checked("#regions"), types = checked("#types");
  if (!regions.length || !types.length) { $("#scanInfo").textContent = t("pick_scope"); Boot.done(); return; }
  $("#btnScan").disabled = true; $("#scanInfo").textContent = t("scanning"); lastScan = null;
  $("#prog").classList.remove("hidden"); $("#prog div").style.width = "3%"; $("#warns").classList.add("hidden");
  try { await api("/api/scan", { regions, types }); }
  catch (e) { $("#scanInfo").textContent = e.message; $("#btnScan").disabled = false; $("#prog").classList.add("hidden"); Boot.done(); return; }
  const poll = async () => {
    let s;
    try { s = await api("/api/scan"); } catch (e) { $("#scanInfo").textContent = e.message; $("#btnScan").disabled = false; Boot.done(); return; }
    if (s.total) { $("#prog div").style.width = (100 * s.done / s.total) + "%"; Boot.progress(s.done, s.total); }
    if (s.status === "running") {
      // 몇 개 남았는지, 어느 리전을 기다리는지 보여준다 (90초 넘으면 서버가 건너뜀)
      const w = s.waiting || [];
      $("#scanInfo").textContent = s.total ? t("scanning_n", { done: s.done, total: s.total }) +
        (w.length && w.length <= 3 ? ` · ${t("waiting", { r: w.join(", ") })}` : "") : t("scanning");
      return setTimeout(poll, 400);
    }
    $("#btnScan").disabled = false; setTimeout(() => $("#prog").classList.add("hidden"), 300);
    Boot.done();
    if (s.status === "error") { $("#scanInfo").textContent = t("error_x", { e: s.error }); return; }
    items = s.items; selected.clear(); results = {}; gone.clear(); typeFilter = null; keyFilter = null;
    lastScan = { regions: regions.length, at: new Date(), warnings: s.warnings || [] };
    renderScanInfo();
    render();
  };
  poll();
}

// 스캔 결과 요약 + 경고 (언어를 바꾸면 다시 그림)
let lastScan = null;
const warnText = (w) => `[${w.region}] ${w.type ? w.type + ": " : ""}` +
  (w.code === "timeout" ? t("warn_timeout", { sec: w.sec }) : (w.detail || ""));
function renderScanInfo() {
  if (!lastScan) return;
  const ws = lastScan.warnings;
  $("#scanInfo").textContent = t("regions_time", { n: lastScan.regions, t: lastScan.at.toLocaleTimeString(LANG) });
  $("#warns").classList.toggle("hidden", !ws.length);
  if (!ws.length) return;
  $("#warns").textContent = t("warn_head", { n: ws.length }) + "\n" + ws.map(warnText).join("\n");
  $("#scanInfo").innerHTML += ` · <a href="#" id="warnLink" style="color:var(--warn)">${esc(t("warnings_n", { n: ws.length }))}</a>`;
  $("#warnLink").onclick = (e) => { e.preventDefault(); document.querySelector("details.scope").open = true;
    $("#warns").scrollIntoView({ behavior: "smooth", block: "center" }); };
}

// ---- 위젯
const live = () => items.filter(i => !gone.has(i.key));
function renderWidgets() {
  const L = live();
  const by = (t) => L.filter(i => i.type === t);
  const sub = {
    "EC2": () => { const r = by("EC2").filter(i => i.state === "running").length; return t("sub_ec2", { r, s: by("EC2").length - r }); },
    "Elastic IP": () => t("sub_eip", { n: by("Elastic IP").filter(i => i.state === "unassociated").length }),
    "EBS Volume": () => t("sub_ebs", { g: by("EBS Volume").reduce((a, i) => a + (parseInt(i.detail) || 0), 0) }),
    "NAT Gateway": () => t("sub_nat"),
    "S3": () => t("sub_s3"),
  };
  $("#tiles").innerHTML = allTypes.map(t => {
    const n = by(t).length;
    return `<div class="tile ${n ? "" : "zero"} ${typeFilter === t ? "on" : ""}" data-t="${esc(t)}">
      <div class="t"><span class="dot" style="background:${TYPE_COLORS[t] || "#888"}"></span>${esc(t)}</div>
      <div class="n">${n}</div><div class="s">${n && sub[t] ? esc(sub[t]()) : "&nbsp;"}</div></div>`;
  }).join("");
  document.querySelectorAll(".tile").forEach(el => el.onclick = () => {
    keyFilter = null; typeFilter = typeFilter === el.dataset.t ? null : el.dataset.t; render(); });

  // 확인 필요: 돈은 나가는데 일은 안 하는 것들
  const groups = [
    { ic: "d", key: "a_respawn", list: L.filter(i => i.managed?.respawn) },
    { ic: "d", key: "a_nat", list: by("NAT Gateway") },
    { ic: "w", key: "a_eip", list: by("Elastic IP").filter(i => i.state === "unassociated") },
    { ic: "w", key: "a_ebs", list: by("EBS Volume") },
    { ic: "w", key: "a_ec2s", list: by("EC2").filter(i => i.state === "stopped") },
    { ic: "w", key: "a_elb", list: by("ELB") },
    { ic: "w", key: "a_vpce", list: by("VPC Endpoint") },
    { ic: "w", key: "a_rds", list: L.filter(i => i.type.startsWith("RDS") && /stopped/.test(i.state)) },
  ].filter(g => g.list.length);
  $("#alerts").innerHTML = groups.length ? groups.map((g, idx) => `
    <div class="alert" data-i="${idx}"><span class="ic ${g.ic}">!</span>
      <div><div>${esc(t(g.key, { n: g.list.length }))}</div><div class="muted" style="font-size:11.5px">${esc(t(g.key + "_n"))}</div></div>
      <span class="go">${esc(t("view"))}</span></div>`).join("")
    : `<div class="alert" style="cursor:default"><span class="ic o">✓</span><div>${esc(t("no_waste"))}</div></div>`;
  document.querySelectorAll(".alert[data-i]").forEach(el => el.onclick = () => {
    const g = groups[+el.dataset.i];
    keyFilter = { labelKey: g.key, n: g.list.length, keys: new Set(g.list.map(i => i.key)) }; typeFilter = null;
    render(); $("#resCard").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  const regions = {};
  L.forEach(i => regions[i.region] = (regions[i.region] || 0) + 1);
  const rs = Object.entries(regions).sort((a, b) => b[1] - a[1]), rmax = Math.max(...rs.map(r => r[1]), 1);
  $("#regionBars").innerHTML = rs.length ? rs.slice(0, 10).map(([r, n]) => `
    <div class="bar"><span class="lbl mono">${esc(r)}</span><span class="val">${n}</span>
      <div class="track"><div class="fill" style="width:${n / rmax * 100}%"></div></div></div>`).join("")
    : `<div class="skeleton">${esc(t("no_res"))}</div>`;
}

// ---- 테이블
function visible() {
  const q = $("#filter").value.trim().toLowerCase();
  return items.filter(i => (!typeFilter || i.type === typeFilter) && (!keyFilter || keyFilter.keys.has(i.key)) &&
    (!q || [i.id, i.name, i.region, i.detail, i.state, stateText(i.state), i.type].join(" ").toLowerCase().includes(q)));
}
// ---- 만든 주체: 태그로 아는 관리 서비스(Auto Scaling 등) + 필요하면 CloudTrail 로 '누가' 조회
function managedBadge(m) {
  if (!m) return "";
  const by = managerName(m.by);
  const tip = `${by} · ${m.name}${m.stack ? ` (${t("cfn_stack", { s: m.stack })})` : ""}` + (m.respawn ? "\n" + t("respawn_tip") : "");
  return `<span class="badge ${m.respawn ? "b-warn" : ""}" title="${esc(tip)}">${m.respawn ? "↻ " : ""}${esc(by)}</span> <span class="muted">${esc(m.name)}</span>`;
}
const fmtWhen = (iso) => new Date(iso).toLocaleString(LANG, { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
function whoText(c) {
  if (!c) return "";
  if (c.loading) return `<span class="muted">${esc(t("looking"))}</span>`;
  if (c.error) return `<span class="err" title="${esc(c.error)}">${esc(t("lookup_failed"))}</span>`;
  if (!c.found) return `<span class="muted" title="${esc(t("no_record_tip"))}">${esc(t("no_record"))}</span>`;
  const who = c.who_kind === "service" ? `${c.who} (${t("aws_service")})` : c.who_kind === "root" ? t("root") : c.who;
  return `<span title="${esc(`${c.arn}\n${c.event} · ${c.ip}`)}">${esc(who)}</span> <span class="muted">${esc(fmtWhen(c.time))}</span>`;
}
function creatorCell(i) {
  const c = creators[i.key], m = managedBadge(i.managed);
  const who = c ? whoText(c) : (i.region === "global" ? "" :
    `<button class="ghost who" data-k="${esc(i.key)}" style="padding:0 4px;font-size:12px" title="${esc(t("who_tip"))}">${esc(t("who_btn"))}</button>`);
  return [m, who].filter(Boolean).join("<br>");
}
async function lookupCreator(key) {
  creators[key] = { loading: true }; render();
  try { creators[key] = await api("/api/creator", { key }); }
  catch (e) { creators[key] = { error: e.message }; }
  render();
}

// 상태: AWS 상태(running 등)는 그대로, Boom 이 만든 상태 코드(unassociated 등)는 번역
const stateText = (s) => (I18N.en["st." + s] ? t("st." + s) : s);
function stateBadge(s) {
  const cls = /^(running|available|active|bucket|associated|nat)$/.test(s) ? "b-run"
    : /^(unassociated|unattached|stopped|pending)$/.test(s) ? "b-warn" : "";
  return `<span class="badge ${cls}">${esc(stateText(s))}</span>`;
}
// 삭제 결과 / 로그: 서버가 보낸 코드 → 문장
function resultText(k, p = {}) {
  if (k === "aws") return p.detail || "";
  return I18N.en["r." + k] ? t("r." + k, p) : t("err." + k, p);
}
function logText(e) {
  if (typeof e === "string") return e;
  const p = e.p || {};
  if (e.k === "start") return t("log.start", { ...p, mode: t(p.dry ? "mode_dry" : "mode_real") });
  if (e.k === "ok" || e.k === "fail") return t("log." + e.k, { label: p.label, msg: resultText(p.code, p.params) });
  return t("log." + e.k, p);
}
function render() {
  renderWidgets();
  const tag = typeFilter || (keyFilter && t(keyFilter.labelKey, { n: keyFilter.n }));
  $("#filterTag").innerHTML = tag ? `<span class="pill">${esc(tag)} <button class="ghost" id="clrF" style="padding:0 2px">✕</button></span>` : "";
  if (tag) $("#clrF").onclick = () => { typeFilter = null; keyFilter = null; render(); };

  const vis = visible();
  $("#rows").innerHTML = vis.length ? vis.map(i => {
    const r = results[i.key];
    const res = r ? `<span class="${r.ok ? "" : "err"}">${esc(resultText(r.k, r.p))}</span>` : "";
    const dis = i.protected || gone.has(i.key);
    return `<tr class="${i.protected ? "prot" : ""} ${gone.has(i.key) ? "gone" : ""}">
      <td><input type="checkbox" data-k="${esc(i.key)}" ${selected.has(i.key) ? "checked" : ""} ${dis ? "disabled" : ""}></td>
      <td><span class="dot" style="background:${TYPE_COLORS[i.type] || "#888"}"></span> ${esc(i.type)}</td>
      <td class="mono">${esc(i.region)}</td><td class="mono">${esc(i.id)}</td>
      <td>${esc(i.name)} ${i.protected ? `<span class="badge b-prot">${esc(t("keep_protected"))}</span>` : ""}</td>
      <td>${stateBadge(i.state)}</td><td>${creatorCell(i)}</td>
      <td class="detail">${esc(i.detail)}${(i.flags || []).map(f => ` · ${esc(t("flag." + f))}`).join("")}</td><td>${res}</td></tr>`;
  }).join("") : `<tr><td colspan="9" class="muted" style="text-align:center;padding:24px">${esc(t("no_resources"))}</td></tr>`;
  document.querySelectorAll("#rows .who").forEach(b => b.onclick = () => lookupCreator(b.dataset.k));
  document.querySelectorAll("#rows input[data-k]").forEach(c => c.onchange = () => {
    c.checked ? selected.add(c.dataset.k) : selected.delete(c.dataset.k); updateSel();
  });
  const selectable = vis.filter(i => !i.protected && !gone.has(i.key));
  $("#chkAll").checked = selectable.length > 0 && selectable.every(i => selected.has(i.key));
  updateSel();
}
function updateSel() {
  $("#selCount").textContent = selected.size ? t("selected_n", { n: selected.size }) : "";
  $("#btnDelete").disabled = selected.size === 0;
  $("#btnDelete").textContent = t($("#dry").checked ? "btn_dry" : "btn_delete", { n: selected.size });
}
$("#chkAll").onchange = (e) => {
  visible().filter(i => !i.protected && !gone.has(i.key)).forEach(i => e.target.checked ? selected.add(i.key) : selected.delete(i.key));
  render();
};
$("#filter").oninput = render;
$("#dry").onchange = updateSel;

// ---- 삭제
$("#btnDelete").onclick = () => {
  const dry = $("#dry").checked;
  const sel = items.filter(i => selected.has(i.key));
  const byType = {};
  sel.forEach(i => byType[i.type] = (byType[i.type] || 0) + 1);
  $("#cTitle").textContent = dry ? t("dry_title") : t("del_title", { n: sel.length });
  const notes = [];
  if (!dry) notes.push(t("irreversible"));
  if (byType["EC2"]) notes.push(t($("#ec2mode").value === "stop" ? "ec2_will_stop" : "ec2_will_term"));
  if (byType["S3"]) notes.push(t("s3_will"));
  const respawn = sel.filter(i => i.managed?.respawn);
  if (respawn.length) notes.push(t("respawn_will", { n: respawn.length, by: [...new Set(respawn.map(i => managerName(i.managed.by)))].join(", ") }));
  if (byType["RDS"] || byType["RDS Cluster"]) notes.push(t($("#rdsSnap").checked ? "rds_snap_will" : "rds_nosnap_will"));
  $("#cBody").textContent = notes.join(" ");
  $("#cList").innerHTML = Object.entries(byType).map(([t, n]) => `<li>${esc(t)} × ${n}</li>`).join("");
  $("#cAcct").classList.toggle("hidden", dry);
  $("#cAcctMsg").innerHTML = tHtml("type_acct", { id: `<b class="mono">${esc(identity.account)}</b>` }); $("#cInput").value = "";
  $("#cOk").textContent = t(dry ? "run_dry" : "run_delete");
  $("#cOk").disabled = !dry;
  $("#confirm").showModal();
};
$("#cInput").oninput = () => $("#cOk").disabled = $("#cInput").value.trim() !== identity.account;
$("#cCancel").onclick = () => $("#confirm").close();
$("#cOk").onclick = async () => {
  $("#confirm").close();
  const dry = $("#dry").checked;
  $("#logCard").classList.remove("hidden");
  $("#btnDelete").disabled = true; $("#btnScan").disabled = true;
  let job;
  try {
    job = await api("/api/delete", { keys: [...selected], dry_run: dry, confirm: $("#cInput").value.trim(),
      ec2_mode: $("#ec2mode").value, rds_snapshot: $("#rdsSnap").checked });
  } catch (e) { appendLog(t("log.error", { e: e.message })); $("#btnScan").disabled = false; updateSel(); return; }
  $("#logCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  let since = 0;
  const poll = async () => {
    const j = await api(`/api/jobs/${job.job_id}?since=${since}`);
    j.logs.forEach(l => appendLog(logText(l))); since = j.next;
    if (j.status === "running") return setTimeout(poll, 1000);
    results = { ...results, ...j.results };
    if (!dry) Object.entries(j.results).forEach(([k, v]) => { if (v.ok) { gone.add(k); selected.delete(k); } });
    $("#btnScan").disabled = false;
    render();
  };
  poll();
};
function appendLog(line) {
  const el = $("#log");
  el.textContent += `[${new Date().toLocaleTimeString(LANG)}] ${line}\n`;
  el.scrollTop = el.scrollHeight;
}
</script>
